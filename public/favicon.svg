<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="14" fill="#0C0D0E"/>
  <!-- Technical Grid -->
  <g stroke="#ffffff" stroke-width="0.8" opacity="0.35">
    <line x1="18" y1="18" x2="48" y2="18" />
    <line x1="18" y1="27" x2="48" y2="27" />
    <line x1="18" y1="36" x2="48" y2="36" />
    <line x1="26" y1="18" x2="26" y2="48" />
    <line x1="34" y1="18" x2="34" y2="48" />
  </g>
  <!-- Box Outline -->
  <rect x="18" y="18" width="64" height="64" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
  <line x1="26" y1="70" x2="80" y2="18" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7" />
  <!-- Bar 1 -->
  <rect x="24" y="58" width="10" height="20" fill="#0C0D0E" stroke="#FFFFFF" stroke-width="2.2" />
  <!-- Bar 2 -->
  <rect x="37" y="46" width="10" height="32" fill="#0C0D0E" stroke="#FFFFFF" stroke-width="2.2" />
  <!-- Signal Arrow -->
  <g id="signal-arrow">
    <path d="M 46 50 L 46 24 L 54 24 L 54 50 Z" fill="#FF4B22" stroke="#FFFFFF" stroke-width="2" />
    <polygon points="50,8 38,24 62,24" fill="#FF4B22" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
  </g>
  <!-- Bar 3 -->
  <rect x="51" y="40" width="10" height="38" fill="#0C0D0E" stroke="#FFFFFF" stroke-width="2.2" />
  <!-- Bar 4 -->
  <rect x="64" y="51" width="10" height="27" fill="#0C0D0E" stroke="#FFFFFF" stroke-width="2.2" />
</svg>